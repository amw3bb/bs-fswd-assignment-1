
name: Deploy Blog Application

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_ID: adroit-chemist-512117-e1
  REGION: ${{ secrets.GOOGLECLOUD_REGION }}
  REMOTE_REPO: dockerhub-remote
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ steps.deploy-frontend.outputs.url }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Keep Google credentials out of Docker images
      - name: Exclude Google credentials
        run: |
          touch .dockerignore
          grep -qxF 'gha-creds-*.json' .dockerignore || \
            echo 'gha-creds-*.json' >> .dockerignore

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLECLOUD_CREDENTIALS }}
          project_id: ${{ env.PROJECT_ID }}

      # 6. Install Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # 7. Configure access to the remote repository
      - name: Configure Google Artifact Registry access
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" --quiet

      # 8. Validate JWT secret
      - name: Validate backend login secret
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET is missing."
            exit 1
          fi

      # 9. Build and push backend to Docker Hub
      - id: build-backend
        name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blog-backend:${{ github.sha }}

      # 10. Verify public Docker Hub image
      - name: Verify backend on Docker Hub
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blog-backend:${{ github.sha }}
        run: |
          DOCKER_CONFIG="$(mktemp -d)" \
            docker buildx imagetools inspect "$IMAGE"

      # 11. Pull backend through Google remote repository
      - name: Verify backend through Google remote
        run: |
          docker pull \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REMOTE_REPO}/${DOCKERHUB_USER}/blog-backend:${GITHUB_SHA}"

      # 12. Deploy backend to Cloud Run
      - id: deploy-backend
        name: Deploy backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: blog-backend
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REMOTE_REPO }}/${{ env.DOCKERHUB_USER }}/blog-backend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --no-invoker-iam-check
          env_vars: |
            JWT_SECRET=${{ secrets.JWT_SECRET }}

      # 13. Build and push frontend to Docker Hub
      - id: build-frontend
        name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blog-frontend-2:${{ github.sha }}
          build-args: |
            VITE_BACKEND_URL=${{ steps.deploy-backend.outputs.url }}/api/v1

      # 14. Verify public Docker Hub frontend image
      - name: Verify frontend on Docker Hub
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blog-frontend-2:${{ github.sha }}
        run: |
          DOCKER_CONFIG="$(mktemp -d)" \
            docker buildx imagetools inspect "$IMAGE"

      # 15. Pull frontend through Google remote repository
      - name: Verify frontend through Google remote
        run: |
          docker pull \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REMOTE_REPO}/${DOCKERHUB_USER}/blog-frontend-2:${GITHUB_SHA}"

      # 16. Deploy frontend to Cloud Run
      - id: deploy-frontend
        name: Deploy frontend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: blog-frontend
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REMOTE_REPO }}/${{ env.DOCKERHUB_USER }}/blog-frontend-2:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --no-invoker-iam-check
