services:
  blog-database:
    image: mongo
    ports:
      - "27017:27017"
    networks:
      - app-network

  blog-backend:
    build: backend/
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-mongodb://host.docker.internal:27017/blog}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    depends_on:
      - blog-database
    networks:
      - app-network

  blog-frontend:
    build:
      context: .
      args:
        VITE_BACKEND_URL: https://super-duper-guacamole-wrgwvj9677wp295p-3001.app.github.dev/api/v1
    ports:
      - "3000:80"
    depends_on:
      - blog-backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge